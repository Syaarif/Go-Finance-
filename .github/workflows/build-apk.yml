name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_B64: 
  KEYSTORE_PASS: gofinance123
  KEY_ALIAS: gofinance
  KEY_PASS: gofinance123

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.1'
          cache: true

      - name: Install Android NDK 27
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" || \
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" || \
          echo "NDK install attempted"

      - name: Decode Keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > PJBL-GoFinance-main/android/app/gofinance.keystore
          echo "Keystore decoded: $(stat -c%s PJBL-GoFinance-main/android/app/gofinance.keystore) bytes"

      - name: Install Dependencies
        working-directory: PJBL-GoFinance-main
        run: flutter pub get

      - name: Build Universal APK (Semua HP Android)
        working-directory: PJBL-GoFinance-main
        run: |
          flutter build apk --release \
            --dart-define=KEYSTORE_PATH=android/app/gofinance.keystore

      - name: Build Split APKs (Ringan per ABI)
        working-directory: PJBL-GoFinance-main
        run: flutter build apk --release --split-per-abi

      - name: Prepare Release APKs
        run: |
          mkdir -p release-apks
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-release.apk        release-apks/GoFinance-Universal-Semua-HP.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk    release-apks/GoFinance-arm64-v8a-ringan.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk  release-apks/GoFinance-armeabi-v7a-32bit.apk
          ls -lh release-apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoFinance-APKs-v1.2.0
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Go Finance v1.2.0 — Siap Pakai di Semua HP Android"
          body: |
            ## 🚀 Go Finance v1.2.0

            ### 📱 Pilih APK sesuai HP kamu:
            | File | Untuk |
            |---|---|
            | **[GoFinance-Universal-Semua-HP.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/GoFinance-Universal-Semua-HP.apk)** 🌟 | **SEMUA HP Android** (paling disarankan, 100% kompatibel) |
            | [GoFinance-arm64-v8a-ringan.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/GoFinance-arm64-v8a-ringan.apk) | HP modern 64-bit (Xiaomi, Samsung, Oppo, Vivo, dll) — ukuran paling ringan |
            | [GoFinance-armeabi-v7a-32bit.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/GoFinance-armeabi-v7a-32bit.apk) | HP Android lama 32-bit |

            > ⚠️ Jika sudah pernah install versi lama, harap **hapus dulu** aplikasi lama sebelum install yang baru.

            ---
            Commit: `${{ github.sha }}`
          files: release-apks/*.apk
          prerelease: false
          make_latest: true
