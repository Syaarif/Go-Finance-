name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.1'
          cache: true

      - name: Install Dependencies
        working-directory: PJBL-GoFinance-main
        run: flutter pub get

      - name: Build Release APK (Split Per ABI - Ringan & Cepat)
        working-directory: PJBL-GoFinance-main
        run: flutter build apk --release --split-per-abi

      - name: Prepare APKs with Friendly Names
        run: |
          mkdir -p release-apks
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/GoFinance-arm64-v8a-ringan.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/GoFinance-armeabi-v7a-32bit.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/GoFinance-x86_64.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoFinance-Release-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Go Finance Latest APK (Auto-Updated)
          body: |
            ## 🚀 Go Finance - Automatic Build
            APK ini otomatis di-build dan di-update setiap kali ada commit/perubahan baru di repository GitHub!

            ### 📱 Download File APK:
            - **[GoFinance-arm64-v8a-ringan.apk](https://github.com/${{ github.repository }}/releases/download/latest/GoFinance-arm64-v8a-ringan.apk)** *(Disarankan - Ukuran super ringan ~15-20MB untuk hampir semua HP Android modern seperti Xiaomi, Samsung, Oppo, Vivo)*
            - **[GoFinance-armeabi-v7a-32bit.apk](https://github.com/${{ github.repository }}/releases/download/latest/GoFinance-armeabi-v7a-32bit.apk)** *(Untuk HP Android tipe lama)*

            ---
            *Commit:* `${{ github.sha }}`
            *Triggered by:* `${{ github.actor }}`
          files: release-apks/*.apk
          prerelease: false
          make_latest: true
