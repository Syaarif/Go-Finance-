name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.1'
          cache: true

      - name: Decode Release Keystore
        working-directory: PJBL-GoFinance-main/android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > gofinance.keystore

      - name: Install Dependencies
        working-directory: PJBL-GoFinance-main
        run: flutter pub get

      - name: Build Universal Release APK (Kompatibel Semua HP Android)
        working-directory: PJBL-GoFinance-main
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: android/app/gofinance.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Split Release APK (Ringan Khusus 64-bit / 32-bit)
        working-directory: PJBL-GoFinance-main
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PATH: android/app/gofinance.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APKs with Friendly Names
        run: |
          mkdir -p release-apks
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-release.apk release-apks/GoFinance-Universal-Semua-HP.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/GoFinance-arm64-v8a-ringan.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/GoFinance-armeabi-v7a-32bit.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/GoFinance-x86_64.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoFinance-Release-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.2.0
          name: Go Finance v1.2.0 (Terbaru - 17 Nov 2026)
          body: |
            ## 🚀 Go Finance v1.2.0 (Update Terbaru)
            APK ini otomatis di-build dan di-rilis setiap ada update baru di GitHub menggunakan Keystore rilis permanen!

            ### 📱 Pilihan File APK:
            - **[GoFinance-Universal-Semua-HP.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/GoFinance-Universal-Semua-HP.apk)** 🌟 *(PALING DISARANKAN — Kompatibel 100% di SEMUA merk dan tipe HP Android, baik 32-bit maupun 64-bit)*
            - **[GoFinance-arm64-v8a-ringan.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/GoFinance-arm64-v8a-ringan.apk)** *(Super ringan ~9 MB, khusus HP Android modern 64-bit seperti Xiaomi, Samsung, Oppo, Vivo, Poco, Realme)*
            - **[GoFinance-armeabi-v7a-32bit.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/GoFinance-armeabi-v7a-32bit.apk)** *(Khusus HP Android lama 32-bit)*

            ---
            *Commit:* `${{ github.sha }}`
            *Triggered by:* `${{ github.actor }}`
          files: release-apks/*.apk
          prerelease: false
          make_latest: true
