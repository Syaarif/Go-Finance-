name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Install Android NDK 28
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" || \
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" || \
          echo "NDK install attempted"

      - name: Decode Keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are not configured; release publishing will be skipped."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > PJBL-GoFinance-main/android/app/gofinance.keystore
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        working-directory: PJBL-GoFinance-main
        run: flutter pub get

      - name: Build Universal APK (Semua HP Android)
        working-directory: PJBL-GoFinance-main
        env:
          ANDROID_KEYSTORE_PATH: gofinance.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            set +e
            flutter build apk --release 2>&1 | tee "$log_file"
            build_status=${PIPESTATUS[0]}
            set -e

            if [ "$build_status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -Eq '429|Too Many Requests' "$log_file"; then
              rm -f "$log_file"
              exit "$build_status"
            fi

            rm -f "$log_file"
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency downloads remained rate-limited after 3 attempts." >&2
              exit "$build_status"
            fi

            delay=$((attempt * 30))
            echo "Maven returned HTTP 429; retrying in ${delay}s (attempt ${attempt}/3)." >&2
            sleep "$delay"
          done

      - name: Build Split APKs (Ringan per ABI)
        working-directory: PJBL-GoFinance-main
        env:
          ANDROID_KEYSTORE_PATH: gofinance.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Prepare Release APKs
        run: |
          mkdir -p release-apks
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-release.apk        release-apks/GoFinance.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-release.apk        release-apks/GoFinance-Universal-Semua-HP.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk    release-apks/GoFinance-arm64-v8a-ringan.apk
          cp PJBL-GoFinance-main/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk  release-apks/GoFinance-armeabi-v7a-32bit.apk
          ls -lh release-apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoFinance-APKs-v1.2.0
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release (v1.2.0)
        uses: softprops/action-gh-release@v2
        if: steps.signing.outputs.enabled == 'true'
        with:
          tag_name: v1.2.0
          name: "Go Finance v1.2.0 — Siap Pakai di Semua HP Android"
          body: |
            ## 🚀 Go Finance v1.2.0 (Update Terbaru)

            ### 📱 Download APK:
            - **[GoFinance.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/GoFinance.apk)** 🌟 **(Bisa untuk SEMUA jenis HP Android)**
            - **[GoFinance-arm64-v8a-ringan.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/GoFinance-arm64-v8a-ringan.apk)** *(Ukuran ringan ~9 MB untuk HP modern 64-bit)*
            - **[GoFinance-armeabi-v7a-32bit.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/GoFinance-armeabi-v7a-32bit.apk)** *(Khusus HP lama 32-bit)*

            > ⚠️ **PENTING:** Jika sebelumnya sudah terpasang aplikasi Go Finance di HP kamu, wajib **Copot Pemasangan / Uninstall** aplikasi lama terlebih dahulu sebelum memasang file baru ini agar tanda tangan APK tidak bentrok.
          files: release-apks/*.apk
          prerelease: false
          make_latest: true

      - name: Update GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        if: steps.signing.outputs.enabled == 'true'
        with:
          tag_name: latest
          name: "Go Finance v1.2.0 (Terbaru - Siap Pakai)"
          body: |
            ## 🚀 Go Finance v1.2.0 (Update Terbaru)

            ### 📱 Download APK:
            - **[GoFinance.apk](https://github.com/${{ github.repository }}/releases/download/latest/GoFinance.apk)** 🌟 **(Bisa untuk SEMUA jenis HP Android)**
            - **[GoFinance-arm64-v8a-ringan.apk](https://github.com/${{ github.repository }}/releases/download/latest/GoFinance-arm64-v8a-ringan.apk)** *(Ukuran ringan ~9 MB untuk HP modern 64-bit)*
            - **[GoFinance-armeabi-v7a-32bit.apk](https://github.com/${{ github.repository }}/releases/download/latest/GoFinance-armeabi-v7a-32bit.apk)** *(Khusus HP lama 32-bit)*

            > ⚠️ **PENTING:** Jika sebelumnya sudah terpasang aplikasi Go Finance di HP kamu, wajib **Copot Pemasangan / Uninstall** aplikasi lama terlebih dahulu sebelum memasang file baru ini agar tanda tangan APK tidak bentrok.
          files: release-apks/*.apk
          prerelease: false
